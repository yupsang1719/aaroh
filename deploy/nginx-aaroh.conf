# nginx site for aaroh.co.uk. Installed by deploy/setup-server.sh to
# /etc/nginx/sites-available/aaroh. The Node app (127.0.0.1:4100) serves everything, including
# the www → aaroh.co.uk redirect. `certbot --nginx -d aaroh.co.uk -d www.aaroh.co.uk` then adds
# HTTPS and the http → https redirect to this file.
server {
    listen 80;
    server_name aaroh.co.uk www.aaroh.co.uk;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
