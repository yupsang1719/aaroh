# Render Blueprint: one web service that serves the API and the built website.
# In Render: New > Blueprint > pick this repository. See README "Deploying to Render".
services:
  - type: web
    name: aaroh
    runtime: node # Node version comes from .nvmrc
    region: frankfurt # closest Render region to the UK
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass # deploy main after the GitHub CI checks pass
    domains:
      - aaroh.co.uk
      - www.aaroh.co.uk
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://aaroh.co.uk
      - key: TRUST_PROXY
        value: '1'
      # Contact form email (Resend SMTP; see README "Contact form email").
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false # the Resend API key: entered in the dashboard, never committed
      - key: SMTP_FROM
        value: Aaroh website <website@aaroh.co.uk>
      - key: CONTACT_NOTIFY_TO
        value: rlp@aaroh.co.uk
