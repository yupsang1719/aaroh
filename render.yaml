# Render Blueprint: one web service that serves the API and the built website.
# In Render: New > Blueprint > pick this repository. See README "Deploying to Render".
services:
  - type: web
    name: aaroh
    runtime: node # Node version comes from .nvmrc
    region: frankfurt # closest Render region to the UK
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass # deploy main after the GitHub CI checks pass
    domains:
      - aaroh.co.uk
      - www.aaroh.co.uk
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://aaroh.co.uk
      - key: TRUST_PROXY
        value: '1'
      # The contact form is off (settings.json › contactFormEnabled), so no email sending is
      # configured. When turning it on, add SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS,
      # SMTP_FROM and CONTACT_NOTIFY_TO here or in the dashboard (README "Contact form email").
